<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#917D3B"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#CFA317"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="#141714"/>
  <text x="640" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F7F3EA">One person. Five stages. One axis: <tspan fill="#D4AF37">coachability</tspan>.</text>
  <path d="M120 290 C 330 285, 420 230, 520 220 S 760 160, 860 140 S 1080 95, 1160 90" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <circle cx="160" cy="280" r="30" fill="#141714" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="2"/>
    <text x="160" y="289" font-size="24" fill="#D4AF37" fill-opacity="0.7" font-weight="bold">1</text>
    <text x="160" y="335" font-size="17" fill="#E8E2D2">"I do it myself."</text>

    <circle cx="400" cy="236" r="32" fill="#141714" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="2"/>
    <text x="400" y="245" font-size="24" fill="#D4AF37" fill-opacity="0.8" font-weight="bold">2</text>
    <text x="400" y="293" font-size="17" fill="#E8E2D2">"I can't get there alone."</text>

    <circle cx="640" cy="188" r="34" fill="#141714" stroke="#D4AF37" stroke-opacity="0.8" stroke-width="2"/>
    <text x="640" y="197" font-size="24" fill="#D4AF37" fill-opacity="0.9" font-weight="bold">3</text>
    <text x="640" y="247" font-size="17" fill="#E8E2D2">"It's moving inside me."</text>

    <circle cx="880" cy="138" r="36" fill="#141714" stroke="#D4AF37" stroke-width="2"/>
    <text x="880" y="147" font-size="24" fill="#D4AF37" font-weight="bold">4</text>
    <text x="880" y="199" font-size="17" fill="#E8E2D2">"I carry it now."</text>

    <circle cx="1120" cy="94" r="38" fill="url(#gold)"/>
    <text x="1120" y="103" font-size="24" fill="#141714" font-weight="bold">5</text>
    <text x="1120" y="158" font-size="17" fill="#E8E2D2">"We carry it together."</text>
  </g>
</svg>
